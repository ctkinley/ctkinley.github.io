<span>


  <meta charset="utf-8">
  <title>Chris Kinley</title>
  <style>
    html{
      background-color: #fffafa;
      font-family: "Arial", sans-serif;
    }
    body {
      width: 1000px;
      height: 100vh;
      margin: 0 auto;
      background-color: #fffafa;
      padding: 0 20px 20px 20px;
      color: #0000ff;
      font-size: 20px;
    }
    h1{
      color: #040404;
      font-size: 32px;
    }
    button{
      width: 270px;
      height: 100px;
      border: 0px;
      outline: none
      background: #000000;
      color: #fffafa;
      font-size: 22px;
      text-align: center;
      position: absolute;
      top: 200px;
      left: 200px;
      cursor: pointer;
    }
  </style>


  <h1>
    About Chris Kinley
  </h1>
    <p id="information">

  </p>
   <button id="movingButton">
    Click to find out more about me
  </button>

  <script>
    const facts = ["Hi, I am Chris Kinley, a second year Master's student in Khoury College of Sciences at the Roux Institute. I am studying to get a masters degree in Data Science.",
                   "In 2023, I graduated from University of Rochester with a B.S. in Mathematicss. After I finished, I was told that if I had taken one additional class, I could have graduated with a major in Economics as well ",
                  "I am an eagle scout from Troop 93 in Maine. I enjoy Camping and Hiking",
                   "I currently work at MaineHealth doing data analysis for various different groups"];
    var numClicks = 0;
    const btn = document.getElementById("movingButton");
    const info = document.getElementById("information");
    btn.addEventListener("click", () => {
      btn.style.left = Math.floor(Math.random()*700)+200+"px";
      btn.style.top = Math.floor(Math.random()*500)+200+"px";
      btn.style.background = "#"+Math.floor(Math.random()*1000000);
      numClicks = numClicks + 1;
      const fact = facts[(Math.floor(numClicks/4))%4];
      info.textContent = fact;
    });
  </script>

</span>
