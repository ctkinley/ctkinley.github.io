<span>


  <meta charset="utf-8">
  <title>Chris Kinley</title>
  <style>
    html{
      background-color: #fffafa;
      font-family: "Arial", sans-serif;
    }
    body {
      width: 1000px;
      height: 100vh;
      margin: 0 auto;
      background-color: #fffafa;
      padding: 0 20px 20px 20px;
      color: #0000ff;
      font-size: 20px;
    }
    h1{
      color: #040404;
      font-size: 32px;
    }
    button{
      width: 270px;
      height: 100px;
      border: 0px;
      outline: none
      background: #000000;
      color: #fffafa;
      font-size: 22px;
      text-align: center;
      position: absolute;
      top: 100px;
      left: 0px;
      cursor: pointer;
    }
  </style>


  <h1>
    About Chris Kinley
  </h1>
   <button id="movingButton">
    Click to find out more about me
  </button>
  <p id="information"> big if true

  </p>
  <script>
    const facts = ["hi1","hi2","hi3","hi4"];
    const clicks = 0;
    const factNum = 0;
    const btn = document.getElementById("movingButton");
    const info = document.getElementById("information");
    btn.addEventListener("click", () => {
      clicks = clicks + 1
      btn.style.left = Math.floor(Math.random()*700)+"px";
      btn.style.top = Math.floor(Math.random()*200)+"px";
      btn.style.background = "#"+Math.floor(Math.random()*1000000);
      if (clicks==3){
        clicks = 0;
        info.textContent = facts[factNum];
        if (factNum>=facts.Length){
          factNum=0;
        }
        else{
          factNum=factNum+1;
        }  
      }
    });
  </script>

</span>
